[package]
name = "headwaters"
version = "0.0.8"
description = "OpenLineage ingest + Marquez-compatible read service (HTTP + ConnectRPC + Postgres)"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/headwaters"
readme = "README.md"
# Deployable service, not a reusable library: ship via Docker + GitHub
# release, never crates.io. `publish = false` makes that contract explicit and
# prevents an accidental `cargo publish`.
publish = false

[dependencies]
# Generated proto types + the ConnectRPC facade (the `ReadService` server trait
# this crate implements + mounts). `server` pulls the hyper/axum runtime.
headwaters-proto = { workspace = true, features = ["server"] }
buffa = { workspace = true, features = ["json"] }
buffa-types = { workspace = true, features = ["json"] }
# ConnectRPC server runtime: the read REST server and the Connect surface serve
# the same buffa messages on one port.
connectrpc = { workspace = true, features = ["server", "axum"] }
sqlx = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
config = { workspace = true }
# CLI surface for the binary: `serve` + a self-`healthcheck` subcommand. Matches
# the feature set headwaters-cli uses (clap is declared per-crate, not workspace).
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# The `healthcheck` subcommand probes /health over HTTP via `blocking` (keeps that
# path off the tokio runtime); rustls avoids a system OpenSSL dependency in the
# distroless image. `json` is for the conformance harness (test-only) — kept here
# rather than a dev-dep so cargo doesn't split the feature set.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
axum = "0.7"
# `fs` provides ServeDir/ServeFile for serving the bundled SPA (see http.rs).
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
# `ServiceBuilder` composes the UI base-path prefix-stripping layer ahead of the
# router (see `mount_under_base` in http.rs); `util` carries it.
tower = { version = "0.5", features = ["util"] }
serde = { workspace = true }
serde_json = "1"
http-body-util = "0.1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[features]
# The Postgres-backed read/projection acceptance tests need Docker (a postgres
# container via testcontainers); gate them off the default test run.
postgres-it = []
# The differential conformance harness brings up the real Marquez reference
# implementation alongside our service and diffs their read APIs; also Docker.
conformance-it = []

[dev-dependencies]
# Round-trips the read API through the real Rust client over a live ConnectRPC
# listener (the `client-it` test); exercises the generated client end to end.
headwaters-client = { workspace = true }
tempfile = "3"
# `tower` (ServiceExt::oneshot, for exercising routers over HTTP in tests) is a
# regular dependency now — see the `[dependencies]` entry.
# Building a `ServiceRequest` for the ConnectRPC handler tests needs an owned
# `Bytes` to back the decoded view (connectrpc::ServiceRequest::from_parts).
bytes = "1"
testcontainers = { version = "0.27", features = ["http_wait"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# `reqwest` (used by the conformance harness to post to / read from the real
# Marquez over HTTP) is a regular dependency now — see the `[dependencies]` entry.
