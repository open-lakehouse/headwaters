[package]
name = "lineage-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
buffa = { version = "0.7", features = ["json"] }
buffa-types = { version = "0.7", features = ["json"] }
sqlx = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
config = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
serde = { workspace = true }
serde_json = "1"
http-body = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
futures = "0.3"
chrono = { workspace = true }
uuid = { workspace = true }

[features]
# The Postgres-backed read/projection acceptance tests need Docker (a postgres
# container via testcontainers); gate them off the default test run.
postgres-it = []

[dev-dependencies]
tempfile = "3"
# For exercising the read router over HTTP in tests (ServiceExt::oneshot), which
# catches route-syntax regressions the direct store-call tests can't.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
testcontainers = { version = "0.27", features = ["http_wait"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
