[package]
name = "lineage-service"
version = "0.1.0"
description = "OpenLineage ingest + Marquez-compatible read service (HTTP + ConnectRPC + Postgres)"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/headwaters"
readme = "README.md"
# Deployable service, not a reusable library: ship via Docker + GitHub
# release, never crates.io. `publish = false` makes that contract explicit and
# prevents an accidental `cargo publish`.
publish = false

[dependencies]
buffa = { version = "0.7", features = ["json"] }
buffa-types = { version = "0.7", features = ["json"] }
# ConnectRPC server runtime for the read-API facade (generated under
# src/connect_gen/). The read REST server and the Connect surface serve the same
# buffa messages on one port.
connectrpc = { version = "0.7", features = ["server", "axum"] }
sqlx = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
config = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { workspace = true }
serde_json = "1"
http-body = "1"
http-body-util = "0.1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { workspace = true }
futures = "0.3"
chrono = { workspace = true }
uuid = { workspace = true }

[features]
# The Postgres-backed read/projection acceptance tests need Docker (a postgres
# container via testcontainers); gate them off the default test run.
postgres-it = []
# The differential conformance harness brings up the real Marquez reference
# implementation alongside our service and diffs their read APIs; also Docker.
conformance-it = []

[dev-dependencies]
tempfile = "3"
# For exercising the read router over HTTP in tests (ServiceExt::oneshot), which
# catches route-syntax regressions the direct store-call tests can't.
tower = { version = "0.5", features = ["util"] }
testcontainers = { version = "0.27", features = ["http_wait"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The conformance harness posts events to / reads from the real Marquez over HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
