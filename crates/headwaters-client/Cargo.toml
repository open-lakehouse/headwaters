[package]
name = "headwaters-client"
version = "0.0.3"
description = "Async Rust client for the Headwaters read API (lineage browse, graph, search, tags, stats)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/open-lakehouse/headwaters"
homepage = "https://github.com/open-lakehouse/headwaters/tree/main/crates/headwaters-client"
documentation = "https://docs.rs/headwaters-client"
readme = "README.md"
keywords = ["openlineage", "lineage", "client", "connectrpc"]
categories = ["database", "api-bindings"]

[dependencies]
headwaters-proto = { workspace = true, features = ["client"] }
buffa-types = { workspace = true, features = ["json"] }
connectrpc = { workspace = true, features = ["client"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
http = "1"
http-body = "1"
# Optional: cloud-provider auth (AWS/Azure/GCP/Databricks) via olai-http's
# ConnectRPC transport. Enabled by the `cloud-auth` feature.
olai-http = { workspace = true, optional = true }

[features]
default = []
# Talk to servers fronted by cloud-provider auth, signing each request with
# olai-http's CloudClient instead of a static bearer token.
cloud-auth = ["dep:olai-http"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
