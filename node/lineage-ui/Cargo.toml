# Release placeholder for the npm package `@open-lakehouse/lineage-ui` (this
# directory). release-plz only understands Cargo packages, so this manifest
# `include`s exactly the files that end up in the npm tarball; a change to any
# of them releases the package. Its `version` is the npm version: release-plz
# bumps it from conventional commits, writes CHANGELOG.md and tags
# `lineage-ui-v<version>`, and release-plz.yml then publishes the npm package to
# GitHub Packages (.github/workflows/publish-npm.yml), stamping this version
# into package.json at pack time. Never published to crates.io.
#
# Having its own manifest takes this directory out of the `headwaters-ui`
# placeholder at node/Cargo.toml; headwaters' `changelog_include` lists this
# package too, so its changes still rebuild the headwaters image.

[package]
name = "lineage-ui"
version = "0.0.1"
description = "Release placeholder for the @open-lakehouse/lineage-ui npm package"
publish = false
readme = "README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false
# Anchored (leading `/`): unanchored names would also match inside node_modules.
include = [
  "/Cargo.toml",
  "/release.rs",
  "/package.json",
  "/README.md",
  "/tsconfig*.json",
  "/src/**",
  "!**/*.test.ts",
  "!**/*.test.tsx",
  "!**/*.stories.tsx",
  "!/src/testing/**",
]

[lib]
path = "release.rs"
