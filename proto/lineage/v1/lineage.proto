syntax = "proto3";

package lineage.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "lineage/v1/facets.proto";

// The OpenLineage event object model.
//
// Core events are thin envelopes; the metadata that matters lives in facets.
// Each carrier (`Run`/`Job`/`InputDataset`/`OutputDataset`/`StaticDataset`)
// keeps a `google.protobuf.Struct facets` bag so *any* official or custom facet
// round-trips opaquely. The `ColumnLineageDatasetFacet` is lifted out of that
// bag into a strong type (see facets.proto for why); the other core facets are
// modeled in facets.proto and read back out of the `Struct` bag on demand.

message RunEvent {
  string event_type = 1;
  google.protobuf.Timestamp event_time = 2;
  Run run = 3;
  Job job = 4;
  repeated InputDataset inputs = 5;
  repeated OutputDataset outputs = 6;
  string producer = 7;
  string raw_json = 8;
  string schema_url = 9;
}

message JobEvent {
  google.protobuf.Timestamp event_time = 1;
  string producer = 2;
  string schema_url = 3;
  Job job = 4;
  repeated InputDataset inputs = 5;
  repeated OutputDataset outputs = 6;
  string raw_json = 7;
}

message DatasetEvent {
  google.protobuf.Timestamp event_time = 1;
  string producer = 2;
  string schema_url = 3;
  StaticDataset dataset = 4;
  string raw_json = 5;
}

message StaticDataset {
  string namespace = 1;
  string name = 2;
  google.protobuf.Struct facets = 3;
  ColumnLineageDatasetFacet column_lineage = 4;
}

message OpenLineageEvent {
  oneof event {
    RunEvent run_event = 1;
    JobEvent job_event = 2;
    DatasetEvent dataset_event = 3;
  }
}

message Run {
  string run_id = 1;
  google.protobuf.Struct facets = 2;
}

message Job {
  string namespace = 1;
  string name = 2;
  google.protobuf.Struct facets = 3;
}

message InputDataset {
  string namespace = 1;
  string name = 2;
  google.protobuf.Struct facets = 3;
  google.protobuf.Struct input_facets = 4;
  ColumnLineageDatasetFacet column_lineage = 5;
}

message OutputDataset {
  string namespace = 1;
  string name = 2;
  google.protobuf.Struct facets = 3;
  google.protobuf.Struct output_facets = 4;
  ColumnLineageDatasetFacet column_lineage = 5;
}

// --- Ingest request/response shapes ---

message IngestEventRequest {
  RunEvent event = 1;
}

message IngestEventResponse {
  string status = 1;
}

message IngestBatchRequest {
  repeated OpenLineageEvent events = 1;
}

message IngestBatchResponse {
  string status = 1;
  BatchSummary summary = 2;
  repeated FailedEvent failed_events = 3;
}

message BatchSummary {
  int32 received = 1;
  int32 successful = 2;
  int32 failed = 3;
  int32 retriable = 4;
  int32 non_retriable = 5;
}

message FailedEvent {
  int32 index = 1;
  string reason = 2;
  bool retriable = 3;
}
