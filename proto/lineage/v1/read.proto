syntax = "proto3";

package lineage.v1;

import "google/protobuf/struct.proto";

// Read-side DTOs: the subset of the Marquez REST contract the web UI consumes
// (namespace/job/dataset browse, the lineage graph, search, the events feed,
// run facets, column lineage, dataset versions).
//
// These mirror the JSON shapes in the Marquez web client. The HTTP layer still
// owns the exact wire serialization (camelCase, the `type` key, the
// `inEdges`/`outEdges` keys, polymorphic `data`), because a few of those quirks
// don't fall out of proto3-JSON automatically; these messages are the shared
// internal type the REST handlers and (later) the Connect service produce.

// `{ namespace, name }` — the identity object the UI uses for jobs and datasets.
message EntityId {
  string namespace = 1;
  string name = 2;
}

// --- /namespaces ---

message Namespace {
  string name = 1;
  string created_at = 2;
  string updated_at = 3;
  string owner_name = 4;
  string description = 5;
  bool is_hidden = 6;
}

message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
}

// --- jobs ---

// The Marquez read-side job DTO. Named `JobDetail` (not `Job`) to avoid
// colliding with the OpenLineage event `Job` in lineage.proto — both live in
// package `lineage.v1`.
message JobDetail {
  EntityId id = 1;
  // Marquez job type; always "BATCH" (the event log doesn't distinguish).
  string type = 2;
  string name = 3;
  string simple_name = 4;
  string namespace = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated EntityId inputs = 8;
  repeated EntityId outputs = 9;
  string location = 10;
  string description = 11;
  RunDetail latest_run = 12;
  repeated RunDetail latest_runs = 13;
  repeated string tags = 14;
  string parent_job_name = 15;
  string parent_job_uuid = 16;
}

// Minimal Marquez `Run` shape — the fields the web UI dereferences. Named
// `RunDetail` to avoid colliding with the OpenLineage event `Run`.
message RunDetail {
  string id = 1;
  string created_at = 2;
  string updated_at = 3;
  // NEW | RUNNING | COMPLETED | FAILED | ABORTED.
  string state = 4;
  string nominal_start_time = 5;
  string nominal_end_time = 6;
  string started_at = 7;
  string ended_at = 8;
  uint64 duration_ms = 9;
}

message ListJobsResponse {
  repeated JobDetail jobs = 1;
  int32 total_count = 2;
}

message ListRunsResponse {
  repeated RunDetail runs = 1;
  int32 total_count = 2;
}

// --- datasets ---

message Dataset {
  EntityId id = 1;
  // Marquez dataset type; always "DB_TABLE".
  string type = 2;
  string name = 3;
  string physical_name = 4;
  string namespace = 5;
  string source_name = 6;
  string created_at = 7;
  string updated_at = 8;
  string description = 9;
  repeated google.protobuf.Struct fields = 10;
  google.protobuf.Struct facets = 11;
  repeated string tags = 12;
  bool deleted = 13;
}

message ListDatasetsResponse {
  repeated Dataset datasets = 1;
  int32 total_count = 2;
}

message DatasetVersion {
  DatasetVersionId id = 1;
  string type = 2;
  string name = 3;
  string physical_name = 4;
  string created_at = 5;
  string version = 6;
  string namespace = 7;
  string source_name = 8;
  repeated google.protobuf.Struct fields = 9;
  repeated string tags = 10;
  string last_modified_at = 11;
  string description = 12;
  google.protobuf.Struct facets = 13;
}

message DatasetVersionId {
  string namespace = 1;
  string name = 2;
  string version = 3;
}

message ListDatasetVersionsResponse {
  repeated DatasetVersion versions = 1;
  int32 total_count = 2;
}

// --- /search ---

message SearchResult {
  string name = 1;
  string namespace = 2;
  string node_id = 3;
  // JOB | DATASET.
  string type = 4;
  string updated_at = 5;
}

message SearchResponse {
  int32 total_count = 1;
  repeated SearchResult results = 2;
}

// --- /events/lineage ---

message ListEventsResponse {
  // Each event is the raw OpenLineage event JSON as ingested.
  repeated google.protobuf.Struct events = 1;
  int32 total_count = 2;
}

// --- /jobs/runs/{id}/facets ---

message RunFacetsResponse {
  string run_id = 1;
  google.protobuf.Struct facets = 2;
}

// --- lineage / column-lineage graph ---

// A directed edge between two nodes, addressed by their `nodeId` strings.
message LineageEdge {
  string origin = 1;
  string destination = 2;
}

// One node in the lineage graph. `data` carries the full Job or Dataset payload
// the UI renders in the side panel.
message LineageNode {
  string id = 1;
  // JOB | DATASET | DATASET_FIELD.
  string type = 2;
  google.protobuf.Struct data = 3;
  repeated LineageEdge in_edges = 4;
  repeated LineageEdge out_edges = 5;
}

message LineageGraph {
  repeated LineageNode graph = 1;
}
