syntax = "proto3";

package lineage.v1;

import "google/api/annotations.proto";
import "lineage/v1/lineage.proto";

// The OpenLineage ingest surface: the spec-aligned `POST /lineage` endpoints that
// accept run/job/dataset events into headwaters' append-only event log.
//
// This service is intentionally limited to ingest — it mirrors the OpenLineage
// HTTP spec. The (non-spec) read API the web UI consumes lives in its own
// package and service, `headwaters.read.v1.ReadService`.
//
// NOTE: buffa generates only the message types from this file today; the
// ConnectRPC service stubs come from a separate `protoc-gen-connect-rust` pass.
service IngestService {
  rpc IngestEvent(IngestEventRequest) returns (IngestEventResponse) {
    option (google.api.http) = {
      post: "/api/v1/lineage"
      body: "event"
    };
  }

  rpc IngestBatch(IngestBatchRequest) returns (IngestBatchResponse) {
    option (google.api.http) = {
      post: "/api/v1/lineage/batch"
      body: "*"
    };
  }
}
