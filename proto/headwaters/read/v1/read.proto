syntax = "proto3";

// The read API is headwaters' own surface — it is NOT part of the OpenLineage
// spec. It lives in its own package (`headwaters.read.v1`), separate from the
// spec-aligned event/facet model + ingest in `lineage.v1`, so its provenance is
// unambiguous and we are free to evolve it.
//
// These messages mirror, field-for-field, the Marquez-compatible JSON the web UI
// consumes (see `crates/headwaters/src/read/model.rs`). Proto field names
// are snake_case; the wire JSON is camelCase. A few Marquez quirks (the `type`
// key, `inEdges`/`outEdges`, polymorphic `data`/`facets` as opaque structs) are
// represented with `google.protobuf.Struct` and a `type` field so the generated
// REST output matches byte-for-byte.
package headwaters.read.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";

// `{ namespace, name }` — the identity object the UI uses for both jobs and
// datasets.
message EntityId {
  string namespace = 1;
  string name = 2;
}

// --- namespaces ---

message Namespace {
  option (google.api.resource) = {
    type: "headwaters.io/Namespace"
    pattern: "namespaces/{namespace}"
    plural: "namespaces"
    singular: "namespace"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string created_at = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string updated_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string owner_name = 4;
  string description = 5;
  bool is_hidden = 6;
}

message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
}

// --- jobs ---

// The Marquez read-side job DTO. Named `JobDetail` (not `Job`) to keep it clearly
// distinct from the OpenLineage event `Job` in the spec package.
message JobDetail {
  option (google.api.resource) = {
    type: "headwaters.io/Job"
    pattern: "jobs/{job}"
    plural: "jobs"
    singular: "job"
  };

  EntityId id = 1;
  // Marquez job type; always "BATCH" (the event log doesn't distinguish).
  string type = 2;
  string name = 3;
  string simple_name = 4;
  string namespace = 5;
  string created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string updated_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated EntityId inputs = 8;
  repeated EntityId outputs = 9;
  string location = 10;
  string description = 11;
  RunDetail latest_run = 12;
  repeated RunDetail latest_runs = 13;
  repeated string tags = 14;
  string parent_job_name = 15;
  string parent_job_uuid = 16;
  // UUID identifying the job's current input/output + metadata shape, like
  // Marquez's `currentVersion`. Refreshed by the projector when edges change.
  string current_version = 17;
}

// Minimal Marquez `Run` shape — the fields the web UI dereferences. Named
// `RunDetail` to stay distinct from the OpenLineage event `Run`.
message RunDetail {
  string id = 1;
  string created_at = 2;
  string updated_at = 3;
  // NEW | RUNNING | COMPLETED | FAILED | ABORTED.
  string state = 4;
  string nominal_start_time = 5;
  string nominal_end_time = 6;
  string started_at = 7;
  string ended_at = 8;
  uint64 duration_ms = 9;
}

message ListJobsResponse {
  repeated JobDetail jobs = 1;
  int32 total_count = 2;
}

message ListRunsResponse {
  repeated RunDetail runs = 1;
  int32 total_count = 2;
}

// --- datasets ---

message Dataset {
  option (google.api.resource) = {
    type: "headwaters.io/Dataset"
    pattern: "datasets/{dataset}"
    plural: "datasets"
    singular: "dataset"
  };

  EntityId id = 1;
  // Marquez dataset type; always "DB_TABLE".
  string type = 2;
  string name = 3;
  string physical_name = 4;
  string namespace = 5;
  string source_name = 6;
  string created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string updated_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string description = 9;
  repeated google.protobuf.Struct fields = 10;
  google.protobuf.Struct facets = 11;
  repeated string tags = 12;
  bool deleted = 13;
  // UUID identifying the dataset's current schema, like Marquez's
  // `currentVersion`. Refreshed by the projector when the schema changes.
  string current_version = 14;
}

message ListDatasetsResponse {
  repeated Dataset datasets = 1;
  int32 total_count = 2;
}

message DatasetVersion {
  DatasetVersionId id = 1;
  string type = 2;
  string name = 3;
  string physical_name = 4;
  string created_at = 5;
  string version = 6;
  string namespace = 7;
  string source_name = 8;
  repeated google.protobuf.Struct fields = 9;
  repeated string tags = 10;
  string last_modified_at = 11;
  string description = 12;
  google.protobuf.Struct facets = 13;
}

message DatasetVersionId {
  string namespace = 1;
  string name = 2;
  string version = 3;
}

message ListDatasetVersionsResponse {
  repeated DatasetVersion versions = 1;
  int32 total_count = 2;
}

// --- search ---

message SearchResult {
  string name = 1;
  string namespace = 2;
  string node_id = 3;
  // JOB | DATASET.
  string type = 4;
  string updated_at = 5;
}

message SearchResponse {
  int32 total_count = 1;
  repeated SearchResult results = 2;
}

// --- events feed ---

message ListEventsResponse {
  // Each event is the raw OpenLineage event JSON as ingested.
  repeated google.protobuf.Struct events = 1;
  int32 total_count = 2;
}

// --- run facets ---

message RunFacetsResponse {
  string run_id = 1;
  google.protobuf.Struct facets = 2;
}

// --- lineage / column-lineage graph ---

// A directed edge between two nodes, addressed by their `nodeId` strings.
message LineageEdge {
  string origin = 1;
  string destination = 2;
}

// One node in the lineage graph. `data` carries the full Job or Dataset payload
// the UI renders in the side panel.
message LineageNode {
  string id = 1;
  // JOB | DATASET | DATASET_FIELD.
  string type = 2;
  google.protobuf.Struct data = 3;
  repeated LineageEdge in_edges = 4;
  repeated LineageEdge out_edges = 5;
}

message LineageGraph {
  repeated LineageNode graph = 1;
}

// --- tags ---

message Tag {
  string name = 1;
  string description = 2;
}

// `GET /api/v1/tags` envelope — the UI reads `payload.tags`.
message ListTagsResponse {
  repeated Tag tags = 1;
}

// One dataset field reached by tag/PII propagation.
message TaggedField {
  string namespace = 1;
  string dataset = 2;
  string field = 3;
  // The `datasetField:` nodeId, for linking into the column-lineage view.
  string node_id = 4;
}

// `GET /api/v1/tags/{tag}/downstream` — the fields reachable downstream from
// anything tagged `tag` (the tagged seeds themselves are included).
message TagPropagation {
  string tag = 1;
  repeated TaggedField fields = 2;
}

// --- stats ---

// One time bucket of a stats series: `{ date, count }` (Marquez's shape).
message StatBucket {
  string date = 1;
  int64 count = 2;
}

// The stats endpoints return a bare JSON array of `StatBucket`. The REST mapping
// uses `response_body: "buckets"` so the wire shape is the array, not an object.
message StatsResponse {
  repeated StatBucket buckets = 1;
}
