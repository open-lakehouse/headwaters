# Rust proto codegen for the lineage event model.
#
# Generates only the `lineage.v1` message/view/enum types — no ConnectRPC service
# stubs: lineage-service ingests OpenLineage JSON over HTTP, not ConnectRPC, and
# these types are the in-memory model that `writer::schema` converts to Arrow.
#
# Regenerate with `just proto-gen` (which scopes the input to the lineage proto).
# Output is committed under crates/lineage-service/src/proto/ so CI runners
# without a proto-codegen step build straight from source. (`proto`, not `gen`:
# `gen` is a reserved keyword in Rust 2024.)
#
# Uses the published remote buffa plugin (runs on the BSR, no local install).
version: v2
plugins:
  - remote: buf.build/anthropics/buffa
    out: crates/lineage-service/src/proto
    opt:
      - file_per_package=true
      - json=true
