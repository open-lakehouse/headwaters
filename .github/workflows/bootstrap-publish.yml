name: Bootstrap publish

# One-time crates.io publish for a brand-NEW crate.
#
# The regular release flow (release-plz.yml) authenticates to crates.io via
# Trusted Publishing (OIDC). Trusted Publishing can only be configured on a crate
# that already EXISTS on crates.io, so the very first publish of a new crate
# cannot use it. This manually-dispatched workflow bridges that one-time gap by
# publishing with a token (CARGO_REGISTRY_TOKEN) instead.
#
# After a crate is published once here, register Trusted Publishing for it on
# crates.io (Settings -> Trusted Publishing: repo open-lakehouse/headwaters,
# workflow release-plz.yml, environment `release`). From then on, release-plz
# handles all its releases via OIDC and this workflow is not needed for it again.
#
# Usage: Actions -> Bootstrap publish -> Run workflow, pick the crate. Crates must
# be bootstrapped in dependency order: headwaters-proto BEFORE headwaters-client.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish for the first time (dependency order: proto before client)."
        required: true
        type: choice
        options:
          - headwaters-proto
          - headwaters-client
      dry_run:
        description: "Run `cargo publish --dry-run` only (no upload)."
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  bootstrap-publish:
    name: Publish ${{ inputs.crate }}
    # Never from forks.
    if: ${{ github.repository == 'open-lakehouse/headwaters' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same protected environment that gates the normal crates.io publish; the
    # CARGO_REGISTRY_TOKEN secret lives here.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Dry-run first regardless, so a misconfigured manifest fails before any
      # upload attempt.
      - name: Verify (dry-run)
        run: cargo publish -p "${{ inputs.crate }}" --dry-run --locked

      - name: Publish to crates.io
        if: ${{ inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # zizmor: ignore[use-trusted-publishing] — Trusted Publishing can only be
        # set up on an existing crate, so a first publish must use a token. The
        # regular release (release-plz.yml) uses OIDC; this workflow is the
        # one-time exception that creates the crate so TP can be enabled.
        run: cargo publish -p "${{ inputs.crate }}" --locked
