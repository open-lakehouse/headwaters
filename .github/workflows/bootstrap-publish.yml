name: Bootstrap publish (one-shot, DELETE AFTER USE)

# ONE-TIME bootstrap to create the never-published crate name on crates.io.
# crates.io OIDC trusted publishing (used by the steady-state release-plz.yml)
# cannot publish a name that has never existed, so this job does the first
# publish with a CARGO_REGISTRY_TOKEN instead. It is also the way to do the
# first publish from CI when a local `cargo publish` is blocked by the corporate
# network. A plain `cargo publish` (not release-plz) keeps the bootstrap simple
# and independent of the OIDC release path.
#
# Scope: publishes `openlineage-client` then `datafusion-openlineage` (the two
# crates.io crates; headwaters is publish = false and ships as a Docker image).
# Order matters — datafusion-openlineage depends on openlineage-client, so the
# dependency must exist on crates.io first.
#
# Prerequisite: add a temporary `CARGO_REGISTRY_TOKEN` repo secret (a crates.io
# API token with publish scope), e.g. on the protected `release` environment.
#
# Manual trigger only — never runs automatically, so it can't race release-plz.
# Run once with dry_run=true to package-check, then again with dry_run=false to
# actually publish.
#
# After the real publish, decommission:
#   1. Register Trusted Publishing for openlineage-client AND
#      datafusion-openlineage on crates.io (repo open-lakehouse/headwaters,
#      workflow release-plz.yml, environment release) so release-plz manages them
#      via OIDC going forward.
#   2. Remove `release = false` from both crates in release-plz.toml so
#      release-plz bumps + publishes them via OIDC from then on.
#   3. Delete the CARGO_REGISTRY_TOKEN secret (and revoke it on crates.io).
#   4. Delete this workflow file.
# Steady-state releases are then handled by release-plz.yml via OIDC (no token).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only, do not actually publish"
        type: boolean
        default: true

permissions: {}

jobs:
  bootstrap-publish:
    name: Bootstrap publish
    if: ${{ github.repository == 'open-lakehouse/headwaters' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release # reuse the protected release environment
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # --locked keeps the artifact reproducible against the committed Cargo.lock.
      # Publish the dependency (openlineage-client) first; datafusion-openlineage
      # depends on it and won't resolve on crates.io until it exists. A dry-run
      # of the dependent can't see the not-yet-published dependency, so skip it
      # when dry_run=true (the dependency's dry-run is enough of a package check).
      - name: Publish openlineage-client
        run: |
          cargo publish -p openlineage-client --locked \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # zizmor: ignore[use-trusted-publishing] — intentional: OIDC trusted
          # publishing cannot create a never-before-published crate name. This
          # one-shot token bootstrap is removed once the name exists.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish datafusion-openlineage
        run: |
          cargo publish -p datafusion-openlineage --locked \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # zizmor: ignore[use-trusted-publishing] — see above.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
