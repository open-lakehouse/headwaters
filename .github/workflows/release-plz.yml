name: Release-plz

# Automated releases. On every push to `main`, release-plz opens/updates a
# single "Release PR" containing per-crate version bumps + regenerated
# changelogs. When that PR is merged, release-plz creates the per-crate git
# tags + GitHub Releases. Crates diverge at publish: headwaters-proto and
# headwaters-client publish to crates.io, while headwaters is `publish = false`
# (a deployable app) and instead has its container image built by the `docker`
# job here. The bundled lineage UI (node/) releases headwaters through the
# `headwaters-ui` placeholder crate and `changelog_include` (see
# release-plz.toml), so a UI-only change also lands here as a headwaters release.
# See release-plz.toml; CONTRIBUTING.md has the full flow.

on:
  push:
    branches:
      - main

# Least privilege: grant per job, nothing at the top level.
permissions: {}

jobs:
  # --- Open/update the Release PR (version bumps + changelogs) ---
  release-plz-pr:
    name: Release PR
    # Never run from forks — they must not open release PRs.
    if: ${{ github.repository == 'open-lakehouse/headwaters' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release-plz-* branch
      pull-requests: write # create/update the Release PR
    # Avoid two pushes to main racing to open/update the same PR.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-plz needs full history to analyze commits
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run release-plz (release-pr)
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: Release
    if: ${{ github.repository == 'open-lakehouse/headwaters' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release # protected env gating the crates.io publish
    permissions:
      contents: write # create tags + GitHub Releases
      id-token: write # crates.io OIDC publish
    outputs:
      # Version + tag of headwaters IF this run released it, else empty.
      service_version: ${{ steps.service.outputs.version }}
      service_tag: ${{ steps.service.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run release-plz (release)
        id: release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-plz (>= 0.3.167) tags and GitHub-releases `git_only` packages
      # itself and lists them in its `releases` output (a JSON array of
      # `package_name` / `version` / `tag`). Pick out `headwaters`; if this run
      # did not release it, the outputs stay empty and Docker is skipped.
      - name: Detect headwaters release
        id: service
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          entry=$(printf '%s' "${RELEASES:-[]}" \
            | jq -c '.[] | select(.package_name == "headwaters")')
          if [ -n "$entry" ]; then
            version=$(printf '%s' "$entry" | jq -r '.version')
            tag=$(printf '%s' "$entry" | jq -r '.tag')
            echo "Released headwaters ${version} (tag ${tag})."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "headwaters was not released this run."
          fi

  # --- Build + push the headwaters Docker image, iff it was released ---
  # Reuses .github/workflows/docker-release.yml with the exact version release-
  # plz reported. Skips when the service wasn't part of this release.
  docker:
    name: Docker release
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.service_version != '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-release.yml
    with:
      version: ${{ needs.release-plz-release.outputs.service_version }}
      ref: ${{ needs.release-plz-release.outputs.service_tag }}
