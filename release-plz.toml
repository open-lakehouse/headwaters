# release-plz configuration — automated, independent per-crate releases.
#
# release-plz (https://release-plz.dev) is the Rust-native release tool (NOT
# Google's release-please). It analyzes conventional commits *per crate* to
# compute semver bumps, regenerates per-crate changelogs, keeps intra-workspace
# dependency version requirements in sync, and publishes to crates.io in
# topological order. PR titles are gated by .github/workflows/pr-title.yml; see
# CONTRIBUTING.md for the end-to-end flow.
#
# All crates are versioned, changelogged, tagged and GitHub-released — but they
# diverge at the publish step:
#   - openlineage-client     -> published to crates.io (a library).
#   - datafusion-openlineage -> published to crates.io (depends on the client,
#     so release-plz publishes the client first).
#   - headwaters             -> `publish = false`: a deployable app, NOT
#     published to crates.io. Its git tag `headwaters-v<version>` instead
#     triggers the Docker image build/push to GHCR (see release-plz.yml ->
#     .github/workflows/docker-release.yml).
#
# Config reference: https://release-plz.dev/docs/config

[workspace]
# Link PRs/commits in the generated changelog back to the repo.
repo_url = "https://github.com/open-lakehouse/headwaters"

# --- Versioning / changelog ---
changelog_update = true        # regenerate per-crate CHANGELOG.md on each release
dependencies_update = false    # don't `cargo update` during the release PR —
                               # keeps Cargo.lock churn out of release commits
semver_check = true            # run cargo-semver-checks before bumping, to catch
                               # accidental breaking changes in published crates

# --- Git tags & GitHub releases (per-crate) ---
# Per-crate tags, e.g. `datafusion-openlineage-v0.1.0` / `headwaters-v0.1.0`.
# The headwaters tag is what the Docker release workflow keys off, and the
# prefix keeps each crate's tags distinct.
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_enable = true
git_release_name = "{{ package }} v{{ version }}"
git_release_body = "{{ changelog }}"

# --- Publishing ---
# release-plz runs `cargo publish` itself, in dependency order. With
# `id-token: write` in the workflow it performs crates.io OIDC publishing, so
# NO CARGO_REGISTRY_TOKEN is required. `headwaters` opts out below.
publish = true
publish_timeout = "30m"        # protoc/codegen-heavy crates are slow to verify

# --- Release PR appearance ---
pr_labels = ["release"]
pr_draft = false

# ---------------------------------------------------------------------------
# Per-package overrides.
# ---------------------------------------------------------------------------
[[package]]
name = "headwaters"
# Version + changelog + git tag + GitHub release, but no `cargo publish` — the
# tag drives the Docker release instead. (Cargo.toml also sets publish = false
# as a belt-and-suspenders guard against an accidental publish.)
publish = false

[[package]]
name = "datafusion-openlineage"
# The crate's directory is `crates/open-lineage/` (only the package name was
# renamed), so pin the changelog path explicitly.
changelog_path = "crates/open-lineage/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Changelog rendering (git-cliff, embedded). Conventional-commit grouping.
# Because commits use crate scopes (feat(client): ...), each crate's changelog
# naturally contains only commits that touched its files.
# ---------------------------------------------------------------------------
[changelog]
protect_breaking_commits = true
sort_commits = "newest"

commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc",      group = "Documentation" },
  { message = "^build",    group = "Build" },
  { message = "^test",     skip = true },
  { message = "^chore",    skip = true },
  { message = "^ci",       skip = true },
]

# Strip the redundant "(scope)" from each rendered line — each crate's changelog
# is already crate-scoped.
commit_preprocessors = [
  { pattern = '\((openlineage-client|client|datafusion-openlineage|open-lineage|headwaters)\)', replace = "" },
]
